<!DOCTYPE html>
<html>
    <body>
        <script>
            async function getJSON(){
                const response = await fetch("https://api.agify.io?name=bella");
                const respuesta = await response.json();

                const edad = respuesta.age;
                console.log("Edad basada en tu nombre: ", edad);
            }

            getJSON();
        </script>
    </body>
</html>
